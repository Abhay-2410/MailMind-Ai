services:
  postgres:
    image: postgres:16-alpine
    container_name: mailmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailmind
      POSTGRES_PASSWORD: mailmind
      POSTGRES_DB: mailmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailmind -d mailmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mailmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./mailmind-ai-backend
      dockerfile: Dockerfile
    container_name: mailmind-backend
    restart: unless-stopped
    # Use env_file without Compose interpolating $ in JWT/CSRF secrets.
    # Pass literal values by doubling $$ in .env when needed, or keep secrets
    # free of unescaped $ characters.
    env_file:
      - ./mailmind-ai-backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      # Local Docker defaults — keep OAuth on this machine (not Vercel tunnel).
      # For phone/Vercel testing, override these and point vercel.json /api proxy at a live tunnel.
      BACKEND_PUBLIC_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://mailmind-ai-frontend.vercel.app,https://mailmind-ai-frontend-abhay-ms-projects.vercel.app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./mailmind-ai-backend/app:/app/app
      - ./mailmind-ai-backend/alembic:/app/alembic
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
