services:
  postgres:
    image: postgres:16-alpine
    container_name: mailmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailmind
      POSTGRES_PASSWORD: mailmind
      POSTGRES_DB: mailmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailmind -d mailmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mailmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./mailmind-ai-backend
      dockerfile: Dockerfile
    container_name: mailmind-backend
    restart: unless-stopped
    env_file:
      - ./mailmind-ai-backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://mailmind:mailmind@postgres:5432/mailmind
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./mailmind-ai-backend/app:/app/app

volumes:
  postgres_data:
  redis_data:
