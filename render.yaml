# Render Blueprint — backend API + Redis for MailMind (Postgres via Supabase)
# Deploy: https://dashboard.render.com/select-repo?type=blueprint
# After deploy, set Vercel VITE_API_BASE_URL to https://<backend-service>.onrender.com/api/v1
# Set BACKEND_PUBLIC_URL to that same https://…onrender.com host (Google OAuth redirect).

services:
  - type: web
    name: mailmind-backend
    runtime: docker
    dockerfilePath: ./mailmind-ai-backend/Dockerfile
    dockerContext: ./mailmind-ai-backend
    plan: free
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: mailmind-redis
          type: keyvalue
          property: connectionString
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        value: https://mailmind-ai-frontend.vercel.app
      - key: CORS_ORIGINS
        value: https://mailmind-ai-frontend.vercel.app,https://mailmind-ai-frontend-abhay-ms-projects.vercel.app
      - key: JWT_SECRET_KEY
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_ASSISTANT_MODEL
        value: llama-3.1-8b-instant

  - type: keyvalue
    name: mailmind-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
